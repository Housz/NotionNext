name: Debug legacy build

on:
  push:
    branches:
      - fix-notion-403

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NOTION_PAGE_ID: "255d2f3d-f028-48b6-8420-6c3cd2062a14"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect Notion root
        run: |
          node - <<'NODE'
          const { NotionAPI } = require('notion-client')
          const pageId = process.env.NOTION_PAGE_ID
          const api = new NotionAPI({ userTimeZone: 'Asia/Tokyo' })
          api.getPage(pageId, {
            gotOptions: {
              headers: {
                'User-Agent': 'NotionNext (+https://github.com/notionnext-org/NotionNext)'
              }
            }
          }).then(data => {
            const clean = pageId.replace(/-/g, '')
            const uuid = clean.replace(/^(........)(....)(....)(....)(............)$/, '$1-$2-$3-$4-$5')
            const blocks = data.block || {}
            const root = blocks[uuid]?.value
            console.log('DIAG_ROOT_ID', uuid)
            console.log('DIAG_ROOT_TYPE', root?.type)
            console.log('DIAG_ROOT_TITLE', JSON.stringify(root?.properties?.title || null))
            console.log('DIAG_ROOT_CONTENT', JSON.stringify(root?.content || []))
            console.log('DIAG_COLLECTION_IDS', JSON.stringify(Object.keys(data.collection || {})))
            console.log('DIAG_VIEW_IDS', JSON.stringify(Object.keys(data.collection_view || {})))
            console.log('DIAG_COLLECTION_QUERY_KEYS', JSON.stringify(Object.keys(data.collection_query || {})))
            console.log('DIAG_COLLECTION_QUERY', JSON.stringify(data.collection_query || {}))
            console.log('DIAG_BLOCK_COUNT', Object.keys(blocks).length)
            console.log('DIAG_BLOCK_SAMPLE', JSON.stringify(Object.entries(blocks).slice(0, 30).map(([id, rec]) => ({
              id,
              type: rec?.value?.type,
              parent_id: rec?.value?.parent_id,
              parent_table: rec?.value?.parent_table,
              collection_id: rec?.value?.collection_id || null,
              title: rec?.value?.properties?.title || null
            }))))
            console.log('DIAG_COLLECTION_META', JSON.stringify(Object.entries(data.collection || {}).map(([id, rec]) => ({
              id,
              name: rec?.value?.name || null,
              schema: rec?.value?.schema || null
            }))))
            const candidates = Object.entries(blocks)
              .filter(([, rec]) => ['collection_view','collection_view_page','page','link_to_page'].includes(rec?.value?.type))
              .map(([id, rec]) => ({
                id,
                type: rec.value.type,
                collection_id: rec.value.collection_id || null,
                content: rec.value.content || null,
                title: rec.value.properties?.title || null,
                page_pointer: rec.value.page_pointer || null
              }))
            console.log('DIAG_CANDIDATES', JSON.stringify(candidates))
          }).catch(err => {
            console.error('DIAG_ERROR', err)
            process.exitCode = 1
          })
          NODE


      - name: Inspect with modern notion-client 7.12.1
        run: |
          mkdir -p /tmp/notion-modern
          cd /tmp/notion-modern
          npm init -y >/dev/null 2>&1
          npm install --silent notion-client@7.12.1
          node --input-type=module - <<'NODE'
          import { NotionAPI } from 'notion-client'
          const pageId = process.env.NOTION_PAGE_ID
          const headers = {
            'User-Agent': 'NotionNext (+https://github.com/notionnext-org/NotionNext)'
          }
          const api = new NotionAPI({
            userTimeZone: 'Asia/Tokyo',
            ofetchOptions: { headers },
            kyOptions: { headers }
          })
          try {
            const data = await api.getPage(pageId)
            const blocks = data.block || {}
            const collections = data.collection || {}
            const clean = pageId.replace(/-/g, '')
            const uuid = clean.replace(/^(........)(....)(....)(....)(............)$/, '$1-$2-$3-$4-$5')
            const rootRec = blocks[uuid] || null
            console.log('MODERN_BLOCK_COUNT', Object.keys(blocks).length)
            console.log('MODERN_ROOT_RECORD', JSON.stringify(rootRec))
            console.log('MODERN_BLOCK_SAMPLE', JSON.stringify(Object.entries(blocks).slice(0, 12)))
            console.log('MODERN_COLLECTION_IDS', JSON.stringify(Object.keys(collections)))
            console.log('MODERN_COLLECTION_RAW', JSON.stringify(collections))
            console.log('MODERN_COLLECTION_META', JSON.stringify(Object.entries(collections).map(([id, rec]) => ({
              id,
              name: rec?.value?.name || rec?.name || null,
              schemaKeys: Object.values(rec?.value?.schema || rec?.schema || {}).map(x => x?.name).filter(Boolean)
            }))))
            console.log('MODERN_COLLECTION_QUERY_KEYS', JSON.stringify(Object.keys(data.collection_query || {})))
          } catch (err) {
            console.error('MODERN_ERROR', err)
            process.exitCode = 1
          }
          NODE

      - name: Build
        run: npm run build
        env:
          VERCEL_ENV: preview
          NEXT_TELEMETRY_DISABLED: "1"
