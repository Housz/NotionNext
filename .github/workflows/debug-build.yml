name: Debug legacy build

on:
  push:
    branches:
      - fix-notion-403

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VERCEL_ENV: preview
          NEXT_TELEMETRY_DISABLED: "1"
          NOTION_PAGE_ID: "255d2f3d-f028-48b6-8420-6c3cd2062a14"
